services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediflow
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - mediflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow -d mediflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mediflow_pgdata:
